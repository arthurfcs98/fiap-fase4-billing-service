name: Deploy AWS EKS

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - run: aws eks update-kubeconfig --name fiap-fase4-eks --region us-east-1

      - name: Fetch DB creds
        id: db
        run: |
          DB=$(aws secretsmanager get-secret-value --secret-id fiap-fase4-db-credentials --region us-east-1 --query SecretString --output text)
          echo "host=$(echo $DB | python3 -c 'import json,sys;print(json.load(sys.stdin)["host"])')" >> $GITHUB_OUTPUT
          echo "pass=$(echo $DB | python3 -c 'import json,sys;print(json.load(sys.stdin)["password"])')" >> $GITHUB_OUTPUT

      - name: Get NLB hostname
        id: nlb
        run: echo "host=$(kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')" >> $GITHUB_OUTPUT

      - name: Ensure K8s Secret (DB + Mercado Pago)
        env:
          DB_PASS: ${{ steps.db.outputs.pass }}
          MP_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MP_KEY: ${{ secrets.MERCADO_PAGO_PUBLIC_KEY }}
        run: |
          kubectl create secret generic billing-service-secrets \
            --from-literal=DB_USERNAME=postgres \
            --from-literal=DB_PASSWORD="$DB_PASS" \
            --from-literal=MERCADO_PAGO_ACCESS_TOKEN="${MP_TOKEN:-CHANGE_ME}" \
            --from-literal=MERCADO_PAGO_PUBLIC_KEY="${MP_KEY:-CHANGE_ME}" \
            -n oficina --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests (RDS + NLB webhook URLs + image tag)
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          NLB_HOST: ${{ steps.nlb.outputs.host }}
        run: |
          IMAGE_TAG=${{ github.sha }}
          sed -e "s|postgres.data.svc.cluster.local|$DB_HOST|g" \
              -e "s|https://api.oficina.example.com/billing/|http://$NLB_HOST/billing/|g" \
              -e "s|:latest|:$IMAGE_TAG|g" \
              -e 's|NODE_ENV: "production"|NODE_ENV: "development"|' \
              -e 's|MP_AUTO_RETURN: "true"|MP_AUTO_RETURN: "false"|' \
            k8s/deployment.yaml | kubectl apply -f -

      - run: kubectl -n oficina rollout status deployment/billing-service --timeout=180s
