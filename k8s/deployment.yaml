apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: oficina
data:
  NODE_ENV: "production"
  PORT: "3002"
  DB_HOST: "postgres.data.svc.cluster.local"
  DB_PORT: "5432"
  DB_DATABASE: "billing_db"
  DB_SSL: "false"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.messaging.svc.cluster.local:5672"
  OTEL_SERVICE_NAME: "fiap-fase4-billing-service"
  MP_NOTIFICATION_URL: "https://api.oficina.example.com/billing/api/webhooks/mercadopago"
  MP_SUCCESS_URL: "https://api.oficina.example.com/billing/api/quotes/callback/success"
  MP_FAILURE_URL: "https://api.oficina.example.com/billing/api/quotes/callback/failure"
  MP_PENDING_URL: "https://api.oficina.example.com/billing/api/quotes/callback/pending"
  MP_AUTO_RETURN: "true"
---
# Secret com Mercado Pago + Postgres creds
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secrets
  namespace: oficina
type: Opaque
stringData:
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
  MERCADO_PAGO_ACCESS_TOKEN: "REPLACE_VIA_CI"
  MERCADO_PAGO_PUBLIC_KEY: "REPLACE_VIA_CI"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: oficina
  labels:
    app: billing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: app
          image: ghcr.io/arthurfcs98/fiap-fase4-billing-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
              name: http
          envFrom:
            - configMapRef:
                name: billing-service-config
            - secretRef:
                name: billing-service-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: oficina
spec:
  type: ClusterIP
  selector:
    app: billing-service
  ports:
    - port: 80
      targetPort: 3002
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing-service-hpa
  namespace: oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing-service
  namespace: oficina
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /billing(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: billing-service
                port:
                  number: 80
