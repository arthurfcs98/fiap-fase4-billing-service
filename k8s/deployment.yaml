# K8s manifests para deploy LOCAL em k3d/kind.
# As credenciais MP são carregadas do Secret 'billing-service-secrets' — crie via:
#   kubectl create secret generic billing-service-secrets \
#     --from-literal=MERCADO_PAGO_ACCESS_TOKEN='APP_USR-...' \
#     --from-literal=MERCADO_PAGO_PUBLIC_KEY='APP_USR-...' \
#     --from-literal=DB_USERNAME=postgres --from-literal=DB_PASSWORD=postgres \
#     -n oficina
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: oficina
data:
  NODE_ENV: "development"   # habilita synchronize:true — cria schema automaticamente
  PORT: "3002"
  DB_HOST: "postgres.data.svc.cluster.local"
  DB_PORT: "5432"
  DB_DATABASE: "billing_db"
  DB_SSL: "false"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.messaging.svc.cluster.local:5672"
  OTEL_SERVICE_NAME: "fiap-fase4-billing-service"
  MP_NOTIFICATION_URL: "http://billing.localhost:8081/api/webhooks/mercadopago"
  MP_SUCCESS_URL: "http://billing.localhost:8081/api/quotes/callback/success"
  MP_FAILURE_URL: "http://billing.localhost:8081/api/quotes/callback/failure"
  MP_PENDING_URL: "http://billing.localhost:8081/api/quotes/callback/pending"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: oficina
  labels:
    app: billing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: app
          image: fiap-fase4-billing-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
              name: http
          envFrom:
            - configMapRef:
                name: billing-service-config
            - secretRef:
                name: billing-service-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: oficina
spec:
  type: ClusterIP
  selector:
    app: billing-service
  ports:
    - port: 80
      targetPort: 3002
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing-service-hpa
  namespace: oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing-service
  namespace: oficina
spec:
  rules:
    - host: billing.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: billing-service
                port:
                  number: 80
